
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusTrade AI - Professional Trading Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #ffffff;
            overflow: hidden;
        }
        .glass {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .citron-glow {
            text-shadow: 0 0 10px rgba(215, 255, 0, 0.5);
        }
        .text-tv-accent { color: #DFFF00; }
        .text-citron { color: #DFFF00; }
        .bg-citron { background-color: #DFFF00; }
        .border-citron { border-color: #DFFF00; }
        .text-tv-muted { color: rgba(255, 255, 255, 0.4); }
        .text-tv-green { color: #089981; }
        .text-tv-red { color: #f23645; }
        .bg-tv-bg { background-color: #050505; }
        .bg-tv-pane { background: rgba(20, 20, 20, 0.8); }
        .border-tv-border { border-color: rgba(255, 255, 255, 0.1); }
        .bg-tv-accent { background-color: #DFFF00; }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(215, 255, 0, 0.2);
            border-radius: 10px;
        }

        /* Ultra-thin scrollbar for overlays */
        .thin-scrollbar::-webkit-scrollbar {
            width: 2px;
        }
        .thin-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .thin-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
        }
        .thin-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(223, 255, 0, 0.3);
        }

        @keyframes jump {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-jump {
            animation: jump 2s infinite ease-in-out;
        }
        .chat-glass {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(215, 255, 0, 0.1);
        }
        /* Hide default scrollbar for specific elements if needed */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
